name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run python -m compileall -q src
      - run: uv build
      - run: uv run twine check dist/*
  desktop-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secret scan
        uses: docker://zricethezav/gitleaks:v8.28.0
        with:
          args: dir /github/workspace --redact --exit-code 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: npm ci --ignore-scripts
      - run: uv run python scripts/build_mcpb.py
      - name: Smoke-test installed desktop bundle
        run: uv run python scripts/check_mcpb.py dist/mcpb/*.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle
          path: dist/mcpb/*
